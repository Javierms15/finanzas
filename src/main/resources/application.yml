spring:
  application:
    name: finanzas

  datasource:
    url: jdbc:postgresql://localhost:5433/finanzas
    username: finanzas
    password: finanzas
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  # Solo accesible desde este equipo: sin esto Spring escucha en todas las interfaces de red
  address: 127.0.0.1

jwt:
  # En el lanzador de escritorio se genera uno aleatorio por instalacion (variable JWT_SECRET)
  secret: ${JWT_SECRET:change-me-in-a-real-environment-please-use-a-long-random-secret}
  expiration-ms: 86400000
